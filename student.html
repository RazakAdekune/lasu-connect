<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LASU Student Page</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['"Space Grotesk"', 'sans-serif'],
            sans: ['Inter', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            ink: "#020617",
            slate: "#334155",
            mist: "#64748b",
            line: "#e2e8f0",
            wash: "#eff6ff",
            accent: "#2050c4",
            glow: "#dbeafe",
            campus: {
              950: '#0b1530',
              900: '#0f1f47',
              800: '#15296b',
              700: '#1d3a8f',
              600: '#2050c4',
              500: '#2f6bef',
              400: '#5b8bf5',
            },
            signal: '#fbbf24',
          },
          boxShadow: {
            panel: "0 20px 50px -12px rgba(15, 31, 71, 0.12)",
            float: "0 30px 70px -15px rgba(29,78,216,0.18)"
          }
        }
      }
    };
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .route-line {
      height: 4px;
      background: linear-gradient(90deg, #fbbf24 0%, #2f6bef 45%, #15296b 100%);
      border-radius: 999px;
    }
    .bg-grid {
      background-image:
        linear-gradient(rgba(15, 31, 71, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(15, 31, 71, 0.05) 1px, transparent 1px);
      background-size: 32px 32px;
    }
    .panel {
      border-radius: 1.75rem;
      border: 1px solid #e2e8f0;
      background: rgba(255,255,255,0.95);
      box-shadow: 0 20px 50px -12px rgba(15, 31, 71, 0.1);
      position: relative;
      overflow: hidden;
    }
    .panel::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(90deg, #fbbf24 0%, #2f6bef 45%, #15296b 100%);
    }
    .section-eyebrow {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.25em;
      color: #2050c4;
    }
    .field-input {
      width: 100%;
      border-radius: 0.875rem;
      border: 1.5px solid #e2e8f0;
      padding: 0.65rem 1rem;
      font-size: 0.9rem;
      transition: border-color 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
      background-color: #f8fafc;
    }
    .field-input[data-input-error="true"] {
      border-color: #ef4444;
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.12);
    }
    .field-input:focus {
      outline: none;
      border-color: #2f6bef;
      box-shadow: 0 0 0 4px rgba(47, 107, 239, 0.12);
      background-color: #ffffff;
    }
    .btn-primary {
      border-radius: 1rem;
      background-color: #0b1530;
      color: #fff;
      padding: 0.7rem 1.3rem;
      font-size: 0.875rem;
      font-weight: 600;
      transition: transform 0.15s ease, background-color 0.15s ease, box-shadow 0.15s ease;
    }
    .btn-primary:hover {
      background-color: #2050c4;
      transform: translateY(-1px);
      box-shadow: 0 12px 28px -8px rgba(32, 80, 196, 0.45);
    }
    .btn-secondary {
      border-radius: 1rem;
      border: 1.5px solid #e2e8f0;
      padding: 0.6rem 1.1rem;
      font-size: 0.85rem;
      font-weight: 500;
      color: #1e293b;
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }
    .btn-secondary:hover {
      border-color: #93c5fd;
      background-color: #eff6ff;
    }
  </style>
</head>
<body class="min-h-screen bg-grid bg-[#f4f7fd] text-ink antialiased">
  <main class="mx-auto max-w-6xl px-5 py-6 lg:px-10 lg:py-8">

    <header class="mb-7 overflow-hidden rounded-[1.75rem] border border-campus-900/10 bg-gradient-to-br from-campus-950 via-campus-800 to-campus-600 p-6 shadow-float lg:p-8">
      <div class="route-line mb-5 w-16"></div>
      <div class="flex flex-col gap-4 lg:flex-row lg:items-center lg:justify-between">
        <div>
          <p class="text-xs font-semibold uppercase tracking-[0.35em] text-signal">LASU Connect</p>
          <h1 class="mt-2 font-display text-3xl font-semibold tracking-tight text-white lg:text-4xl">Student Dashboard</h1>
          <p id="student-scope" class="mt-2 text-sm text-blue-100/80"></p>
        </div>
        <button id="logout-btn" class="rounded-2xl border border-white/20 bg-white/10 px-5 py-2.5 text-sm font-medium text-white backdrop-blur transition hover:bg-white/20">Logout</button>
      </div>
    </header>

    <nav class="mb-6 grid grid-cols-2 gap-2 rounded-[1.5rem] border border-slate-200 bg-white/95 p-2 shadow-panel backdrop-blur sm:grid-cols-5">
      <button class="student-tab rounded-2xl border border-slate-200 bg-ink px-3 py-2.5 text-sm font-medium text-white shadow-sm transition hover:bg-campus-600" data-view-target="timetable">Timetable</button>
      <button class="student-tab rounded-2xl border border-slate-200 px-3 py-2.5 text-sm font-medium text-slate-700 transition hover:border-blue-300 hover:bg-blue-50" data-view-target="map">GPS Navigation</button>
      <button class="student-tab rounded-2xl border border-slate-200 px-3 py-2.5 text-sm font-medium text-slate-700 transition hover:border-blue-300 hover:bg-blue-50" data-view-target="submit-report">Submit Report</button>
      <button class="student-tab rounded-2xl border border-slate-200 px-3 py-2.5 text-sm font-medium text-slate-700 transition hover:border-blue-300 hover:bg-blue-50" data-view-target="my-reports">My Reports</button>
      <button class="student-tab rounded-2xl border border-slate-200 px-3 py-2.5 text-sm font-medium text-slate-700 transition hover:border-blue-300 hover:bg-blue-50" data-view-target="notifications">Notifications</button>
    </nav>

    <section id="view-timetable" class="student-view panel mb-6 p-6">
      <p class="section-eyebrow">Academic Schedule</p>
      <h2 class="mt-1 font-display text-2xl font-semibold text-slate-950">My Timetable</h2>
      <div id="timetable-list" class="mt-4 space-y-2"></div>
    </section>

    <section id="view-map" class="student-view panel mb-6 hidden p-6">
      <p class="section-eyebrow">Campus Navigation</p>
      <h2 class="mt-1 font-display text-2xl font-semibold text-slate-950">GPS Navigation</h2>
      <div class="mt-4 grid gap-3 md:grid-cols-3">
        <div>
          <label for="route-start" class="mb-1.5 block text-sm font-semibold text-slate-700">Location</label>
          <select id="route-start" class="field-input"></select>
        </div>
        <div>
          <label for="route-destination" class="mb-1.5 block text-sm font-semibold text-slate-700">Select Destination</label>
          <select id="route-destination" class="field-input"></select>
        </div>
        <div class="flex items-end">
          <button id="draw-route-button" class="btn-primary w-full">Draw Route</button>
        </div>
      </div>
      <p id="route-verification-hint" class="mt-2 text-xs text-mist"></p>
      <div class="mt-2 flex flex-wrap items-center gap-2">
        <p id="live-location-status" class="text-xs text-slate">Live location: waiting for GPS fix.</p>
        <button id="refresh-live-location-button" class="btn-secondary px-3 py-1 text-xs">Refresh Live GPS</button>
      </div>
      <div class="mt-4 grid gap-4 lg:grid-cols-[1.15fr_0.85fr]">
        <div class="rounded-2xl border border-blue-100 bg-wash p-4 shadow-sm">
          <div class="mb-3 flex gap-2">
            <input id="map-search" class="field-input" placeholder="Search location">
            <button id="map-search-button" class="btn-primary whitespace-nowrap">Search</button>
          </div>
          <div id="map-grid" class="min-h-[360px] rounded-2xl border border-dashed border-line bg-white" style="min-height:360px;height:360px;"></div>
        </div>
        <div class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
          <p class="section-eyebrow">Route target</p>
          <h3 id="route-target" class="mt-1 font-display text-xl font-semibold text-slate-950"></h3>
          <p id="route-summary" class="mt-2 text-sm text-slate"></p>
          <div class="mt-4 space-y-2 text-sm">
            <p><span class="font-semibold text-slate-700">Estimated time:</span> <span id="route-time" class="font-mono"></span></p>
            <p><span class="font-semibold text-slate-700">Next stop:</span> <span id="route-next-stop"></span></p>
          </div>
          <button id="open-google-maps-button" class="btn-secondary mt-3">Open in Google Maps</button>
          <div id="quick-locations" class="mt-4 flex flex-wrap gap-2"></div>
        </div>
      </div>
    </section>

    <section id="view-submit-report" class="student-view panel mb-6 hidden p-6">
      <p class="section-eyebrow">Complaint Management</p>
      <h2 class="mt-1 font-display text-2xl font-semibold text-slate-950">Submit Report</h2>
      <form id="report-form" class="mt-5 grid gap-4 md:grid-cols-2">
        <select id="issue-type" class="field-input"></select>
        <select id="issue-location" class="field-input"></select>
        <textarea id="issue-description" rows="4" class="field-input md:col-span-2" placeholder="Describe issue"></textarea>
        <input id="issue-image" type="file" accept="image/*" class="field-input text-sm md:col-span-2">
        <button class="btn-primary md:col-span-2">Submit report</button>
      </form>
      <p id="report-feedback" class="mt-3 text-sm font-medium text-slate"></p>
    </section>

    <section id="view-my-reports" class="student-view panel mb-6 hidden p-6">
      <p class="section-eyebrow">Report Queue</p>
      <h2 class="mt-1 font-display text-2xl font-semibold text-slate-950">My Reports</h2>
      <div id="report-list" class="mt-4 space-y-2"></div>
    </section>

    <section id="view-notifications" class="student-view panel hidden p-6">
      <p class="section-eyebrow">Updates</p>
      <h2 class="mt-1 font-display text-2xl font-semibold text-slate-950">Notifications</h2>
      <div id="notifications-list" class="mt-4 space-y-2"></div>
    </section>
  </main>

  <script src="data.js"></script>
  <script src="supabase-config.js"></script>
  <script src="shared.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="student.js"></script>
</body>
</html>
