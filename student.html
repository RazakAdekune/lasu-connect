<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LASU Student Page</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: "#000000",
            slate: "#555555",
            mist: "#777777",
            line: "#EAEAEA",
            wash: "#F5F5F5",
            accent: "#1F2937"
          },
          boxShadow: {
            panel: "0 1px 2px rgba(0,0,0,0.03), 0 8px 24px rgba(0,0,0,0.04)"
          }
        }
      }
    };
  </script>
</head>
<body class="bg-white text-ink antialiased">
  <main class="mx-auto max-w-6xl px-5 py-6 lg:px-10 lg:py-8">
    <header class="mb-8 rounded-2xl border border-line bg-white p-6 shadow-panel">
      <div class="flex flex-col gap-4 lg:flex-row lg:items-center lg:justify-between">
        <div>
          <p class="text-xs uppercase tracking-[0.3em] text-mist">LASU Connect</p>
          <h1 class="mt-2 text-3xl font-semibold tracking-tight">Student Dashboard</h1>
          <p id="student-scope" class="mt-2 text-sm text-slate"></p>
        </div>
        <button id="logout-btn" class="rounded-xl border border-line px-5 py-3 text-sm transition hover:bg-wash">Logout</button>
      </div>
    </header>

    <nav class="mb-6 grid grid-cols-2 gap-2 rounded-2xl border border-line bg-white p-2 shadow-panel sm:grid-cols-5">
      <button class="student-tab rounded-xl border border-line bg-ink px-3 py-2 text-sm text-white" data-view-target="timetable">Timetable</button>
      <button class="student-tab rounded-xl border border-line px-3 py-2 text-sm" data-view-target="map">GPS Navigation</button>
      <button class="student-tab rounded-xl border border-line px-3 py-2 text-sm" data-view-target="submit-report">Submit Report</button>
      <button class="student-tab rounded-xl border border-line px-3 py-2 text-sm" data-view-target="my-reports">My Reports</button>
      <button class="student-tab rounded-xl border border-line px-3 py-2 text-sm" data-view-target="notifications">Notifications</button>
    </nav>

    <section id="view-timetable" class="student-view mb-6 rounded-2xl border border-line bg-white p-6 shadow-panel">
      <p class="text-sm uppercase tracking-[0.2em] text-mist">Academic Schedule</p>
      <h2 class="mt-2 text-2xl font-semibold">My Timetable</h2>
      <div id="timetable-list" class="mt-3 space-y-2"></div>
    </section>

    <section id="view-map" class="student-view mb-6 hidden rounded-2xl border border-line bg-white p-6 shadow-panel">
      <p class="text-sm uppercase tracking-[0.2em] text-mist">Campus Navigation</p>
      <h2 class="mt-2 text-2xl font-semibold">GPS Navigation</h2>
      <div class="mt-4 grid gap-3 md:grid-cols-3">
        <div>
          <label for="route-start" class="mb-2 block text-sm font-medium">Location</label>
          <select id="route-start" class="w-full rounded-xl border border-line px-4 py-2"></select>
        </div>
        <div>
          <label for="route-destination" class="mb-2 block text-sm font-medium">Select Destination</label>
          <select id="route-destination" class="w-full rounded-xl border border-line px-4 py-2"></select>
        </div>
        <div class="flex items-end">
          <button id="draw-route-button" class="w-full rounded-xl bg-ink px-4 py-2 text-sm text-white">Draw Route</button>
        </div>
      </div>
      <p id="route-verification-hint" class="mt-2 text-xs text-mist"></p>
      <div class="mt-2 flex flex-wrap items-center gap-2">
        <p id="live-location-status" class="text-xs text-slate">Live location: waiting for GPS fix.</p>
        <button id="refresh-live-location-button" class="rounded-xl border border-line px-3 py-1 text-xs">Refresh Live GPS</button>
      </div>
      <div class="mt-4 grid gap-4 lg:grid-cols-[1.15fr_0.85fr]">
        <div class="rounded-xl border border-line bg-wash p-4">
          <div class="mb-3 flex gap-2">
            <input id="map-search" class="w-full rounded-xl border border-line px-4 py-2" placeholder="Search location">
            <button id="map-search-button" class="rounded-xl bg-ink px-4 py-2 text-sm text-white">Search</button>
          </div>
          <div id="map-grid" class="min-h-[360px] rounded-xl border border-dashed border-line bg-white"></div>
        </div>
        <div class="rounded-xl border border-line bg-white p-4">
          <p class="text-sm text-mist">Route target</p>
          <h3 id="route-target" class="mt-1 text-xl font-semibold"></h3>
          <p id="route-summary" class="mt-2 text-sm text-slate"></p>
          <div class="mt-4 space-y-2 text-sm">
            <p><span class="font-medium">Estimated time:</span> <span id="route-time"></span></p>
            <p><span class="font-medium">Next stop:</span> <span id="route-next-stop"></span></p>
          </div>
          <button id="open-google-maps-button" class="mt-3 rounded-xl border border-line px-3 py-2 text-xs">Open in Google Maps</button>
          <div id="quick-locations" class="mt-4 flex flex-wrap gap-2"></div>
        </div>
      </div>
    </section>

    <section id="view-submit-report" class="student-view mb-6 hidden rounded-2xl border border-line bg-white p-6 shadow-panel">
      <p class="text-sm uppercase tracking-[0.2em] text-mist">Complaint Management</p>
      <h2 class="mt-2 text-2xl font-semibold">Submit Report</h2>
      <form id="report-form" class="mt-5 grid gap-4 md:grid-cols-2">
        <select id="issue-type" class="rounded-xl border border-line px-4 py-3"></select>
        <select id="issue-location" class="rounded-xl border border-line px-4 py-3"></select>
        <textarea id="issue-description" rows="4" class="rounded-xl border border-line px-4 py-3 md:col-span-2" placeholder="Describe issue"></textarea>
        <input id="issue-image" type="file" accept="image/*" class="rounded-xl border border-line px-4 py-3 md:col-span-2">
        <button class="rounded-xl bg-ink px-6 py-3 text-sm font-medium text-white transition hover:bg-accent md:col-span-2">Submit report</button>
      </form>
      <p id="report-feedback" class="mt-3 text-sm text-slate"></p>
    </section>

    <section id="view-my-reports" class="student-view mb-6 hidden rounded-2xl border border-line bg-white p-6 shadow-panel">
      <p class="text-sm uppercase tracking-[0.2em] text-mist">Report Queue</p>
      <h2 class="mt-2 text-2xl font-semibold">My Reports</h2>
      <div id="report-list" class="mt-3 space-y-2"></div>
    </section>

    <section id="view-notifications" class="student-view hidden rounded-2xl border border-line bg-white p-6 shadow-panel">
      <p class="text-sm uppercase tracking-[0.2em] text-mist">Updates</p>
      <h2 class="mt-2 text-2xl font-semibold">Notifications</h2>
      <div id="notifications-list" class="mt-3 space-y-2"></div>
    </section>
  </main>

  <script src="data.js"></script>
  <script src="shared.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="student.js"></script>
</body>
</html>
